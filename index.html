<!doctype html>
<!-- FROM A FOUNTAIN — '72 chrome + woodgrain head unit
     data-channel: YouTube channel ID
     data-audio-url: FLAC mount (lossless, preferred)
     data-audio-fallback: MP3 mount (iPhone/Safari + backup) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap');

.cr{--wood-1:#6b4423;--wood-2:#8a5a2c;--wood-3:#4e3419;--chrome-hi:#fff;--chrome:#b9bec4;--chrome-lo:#5f656d;--amber:#ffb43a;--cream:#ffe6b8;--red:#e23b2f;--green:#57d06a;--font:'Oswald','Arial Narrow',system-ui,sans-serif;
  box-sizing:border-box;max-width:600px;margin:0 auto;
  padding:clamp(10px,3vw,20px) max(8px,env(safe-area-inset-left)) 40px max(8px,env(safe-area-inset-right));
  font-family:var(--font);color:var(--cream);-webkit-tap-highlight-color:transparent}
.cr *,.cr *::before,.cr *::after{box-sizing:border-box}

/* UNIT */
.cr-unit{border-radius:14px;padding:12px;border:1px solid #3a2712;
  background:repeating-linear-gradient(91deg,rgba(0,0,0,.14) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(90deg,rgba(255,225,175,.05) 0 1px,transparent 1px 10px),
    linear-gradient(92deg,var(--wood-1),var(--wood-2) 22%,var(--wood-3) 46%,var(--wood-2) 70%,var(--wood-1));
  box-shadow:0 20px 44px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,230,190,.25),inset 0 -3px 6px rgba(0,0,0,.4)}
.cr-face{border-radius:9px;padding:14px 14px 16px;background:linear-gradient(180deg,#141414,#1d1d1d 40%,#0e0e0e);
  border:2px solid transparent;border-image:linear-gradient(180deg,var(--chrome-hi),var(--chrome) 45%,var(--chrome-lo)) 1;
  box-shadow:inset 0 0 0 2px #000,0 6px 14px rgba(0,0,0,.5)}

/* TOP */
.cr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cr-badge{font-weight:700;font-size:clamp(19px,5.4vw,26px);letter-spacing:.02em;padding:5px 14px;border-radius:5px;color:#2a2a2a;white-space:nowrap;
  background:linear-gradient(180deg,#fff,#cfd3d8 46%,#8b9098 54%,#eef1f4);
  box-shadow:inset 0 1px 0 #fff,inset 0 -2px 3px rgba(0,0,0,.4),0 2px 3px rgba(0,0,0,.5);text-shadow:0 1px 0 rgba(255,255,255,.6)}
.cr-onair{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;letter-spacing:.18em;color:#6b6157}
.cr-onair .lamp{width:11px;height:11px;border-radius:50%;background:#3a2016;box-shadow:inset 0 0 3px #000}
.cr-live .cr-onair{color:var(--amber)}
.cr-live .cr-onair .lamp{background:var(--red);box-shadow:0 0 10px var(--red)}
.cr-search .cr-onair .lamp{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:cr-blink 1s steps(1) infinite}
@keyframes cr-blink{50%{opacity:.25}}

/* DIAL */
.cr-dial{position:relative;border-radius:6px;padding:2px;background:linear-gradient(180deg,var(--chrome-lo),#2a2d31)}
.cr-glass{position:relative;height:86px;border-radius:4px;overflow:hidden;transition:filter .5s ease;
  background:radial-gradient(120% 150% at 50% 0%,rgba(255,180,58,.5),transparent 60%),linear-gradient(180deg,#3a2408,#241505 70%,#160d03);
  box-shadow:inset 0 0 18px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,200,120,.25)}
.cr-dark .cr-glass{filter:brightness(.42) saturate(.55)}
.cr-scale{position:absolute;inset:0;padding:10px 16px 0}
.cr-ticks{display:flex;justify-content:space-between;align-items:flex-start}
.cr-ticks span{font-size:15px;font-weight:500;color:var(--cream);text-shadow:0 0 6px rgba(255,180,58,.6)}
.cr-ticks span::before{content:'';display:block;width:1px;height:9px;margin:0 auto 3px;background:rgba(255,230,190,.7)}
.cr-fm{position:absolute;left:16px;bottom:9px;font-size:12px;letter-spacing:.24em;color:var(--amber);font-weight:600}
.cr-lamps{position:absolute;right:14px;bottom:9px;display:flex;gap:12px;font-size:11px;letter-spacing:.16em;font-weight:600}
.cr-lamps span{color:#5a4020}
.cr-live .cr-lamps .tuned{color:var(--green);text-shadow:0 0 8px rgba(87,208,106,.7)}
.cr-live .cr-lamps .stereo{color:var(--amber);text-shadow:0 0 8px rgba(255,180,58,.6)}
.cr-needle{position:absolute;top:6px;bottom:22px;left:14%;width:2px;border-radius:2px;
  background:linear-gradient(180deg,#ff7a5a,var(--red));box-shadow:0 0 8px rgba(226,59,47,.9)}
.cr-search .cr-needle{animation:cr-sweep 3.1s ease-in-out infinite}
.cr-live .cr-needle{left:63%;transition:left .8s cubic-bezier(.3,1.4,.5,1)}
.cr-dark .cr-needle{left:15%;opacity:.35}
@keyframes cr-sweep{0%,100%{left:11%}50%{left:87%}}

/* CONTROLS */
.cr-controls{display:flex;align-items:center;gap:12px;margin-top:16px}
.cr-knob{flex:none;width:52px;height:52px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 38% 30%,#fff 0 8%,transparent 9%),conic-gradient(from 210deg,#eef1f4,#7b8188 25%,#d6dade 50%,#6b7178 75%,#eef1f4);
  box-shadow:inset 0 0 0 3px #2b2e32,inset 0 -3px 6px rgba(0,0,0,.5),0 3px 5px rgba(0,0,0,.5)}
.cr-knob::after{content:'';position:absolute;top:6px;left:50%;width:3px;height:14px;background:#1c1e20;border-radius:2px;transform:translateX(-50%)}
.cr-knob .cap{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.14em;color:#3a2712;font-weight:600;white-space:nowrap}
.cr-buttons{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cr-btn{appearance:none;cursor:pointer;font-family:var(--font);font-weight:700;font-size:clamp(20px,5.6vw,26px);letter-spacing:.06em;color:#f4ede0;
  padding:20px 8px;border-radius:8px;position:relative;background:linear-gradient(180deg,#2c2c2c,#161616);
  border:3px solid transparent;border-image:linear-gradient(180deg,var(--chrome-hi),var(--chrome) 40%,var(--chrome-lo) 70%,#3a3d41) 1;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 -8px 14px rgba(0,0,0,.55),0 4px 7px rgba(0,0,0,.5);
  text-shadow:0 1px 2px rgba(0,0,0,.7);transition:transform .06s ease}
.cr-btn .sub{display:block;font-weight:500;font-size:11px;letter-spacing:.2em;color:#8a8175;margin-top:3px}
.cr-btn:active{transform:translateY(2px);box-shadow:inset 0 3px 10px rgba(0,0,0,.7)}
.cr-btn:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.cr-btn[aria-pressed="true"]{background:linear-gradient(180deg,#5a3410,#3a1f06);color:#fff;text-shadow:0 0 12px rgba(255,180,58,.9);
  box-shadow:inset 0 0 20px rgba(255,150,40,.55),inset 0 2px 0 rgba(255,220,160,.3),0 4px 7px rgba(0,0,0,.5)}
.cr-btn[aria-pressed="true"] .sub{color:var(--amber)}

/* STATUS */
.cr-status{min-height:1.3em;margin:14px 4px 0;font-size:15px;font-weight:500;letter-spacing:.02em;color:#c9b48c}
.cr-status::before{content:'▸ ';color:var(--amber)}
.cr-status a{color:var(--amber)}

/* STAGES */
.cr-stage{margin-top:14px}
.cr-stage.hidden{display:none}
.cr-frame{border-radius:8px;overflow:hidden;border:3px solid #2b2e32;box-shadow:0 6px 14px rgba(0,0,0,.5);background:#000}
.cr-frame iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.cr-audio-wrap{border-radius:8px;padding:12px;background:linear-gradient(180deg,#1d1d1d,#0e0e0e);
  border:2px solid transparent;border-image:linear-gradient(180deg,var(--chrome),var(--chrome-lo)) 1}
.cr-audio-wrap .hd{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.14em;color:#8a8175;font-weight:600;margin-bottom:9px}
.cr-audio-wrap .hd .st{color:var(--amber)}
.cr-audio-wrap audio{width:100%;display:block}

@media (max-width:420px){.cr-knob{width:40px;height:40px}.cr-knob .cap{display:none}.cr-btn{padding:18px 6px}}
@media (prefers-reduced-motion:reduce){.cr-search .cr-needle{animation:none;left:50%}.cr-search .cr-onair .lamp{animation:none}}
</style>

<div class="cr cr-search"
  data-channel="UCaOM2mNthp-3w-bGoTy8MAg"
  data-audio-url="https://malika-unflaky-loan.ngrok-free.dev/stream.ogg"
  data-audio-fallback="https://malika-unflaky-loan.ngrok-free.dev/stream.mp3">

  <div class="cr-unit"><div class="cr-face">
    <div class="cr-top">
      <div class="cr-badge">From&nbsp;a&nbsp;Fountain</div>
      <div class="cr-onair"><span class="lamp"></span>ON&nbsp;AIR</div>
    </div>

    <div class="cr-dial"><div class="cr-glass">
      <div class="cr-scale"><div class="cr-ticks">
        <span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span>
      </div></div>
      <div class="cr-fm">FM</div>
      <div class="cr-lamps"><span class="tuned">TUNED</span><span class="stereo">STEREO</span></div>
      <div class="cr-needle"></div>
    </div></div>

    <div class="cr-controls">
      <div class="cr-knob" aria-hidden="true"><span class="cap">VOL</span></div>
      <div class="cr-buttons">
        <button class="cr-btn cr-watch" type="button" aria-pressed="false">WATCH<span class="sub">VIDEO</span></button>
        <button class="cr-btn cr-listen" type="button" aria-pressed="false">LISTEN<span class="sub">LOSSLESS</span></button>
      </div>
      <div class="cr-knob" aria-hidden="true"><span class="cap">TUNE</span></div>
    </div>
  </div></div>

  <div class="cr-status" role="status" aria-live="polite"></div>

  <div class="cr-stage cr-video hidden"><div class="cr-frame"><div class="cr-video-mount"></div></div></div>

  <div class="cr-stage cr-audio hidden"><div class="cr-audio-wrap">
    <div class="hd"><span class="cr-audio-hd">AUDIO / FLAC 48 kHz</span><span class="st cr-audio-state">READY</span></div>
    <audio class="cr-audio" controls preload="none"></audio>
  </div></div>
</div>

<script>
(() => {
'use strict';
const root = document.currentScript?.closest('.cr') || document.querySelector('.cr');
if (!root || root.dataset.init) return;
root.dataset.init = '1';

const $ = s => root.querySelector(s);
const CH = root.dataset.channel;
const STREAMS = [
  { url: root.dataset.audioUrl,      type: 'audio/ogg; codecs="flac"', label: 'LOSSLESS', hd: 'AUDIO / FLAC 48 kHz' },
  { url: root.dataset.audioFallback, type: 'audio/mpeg',               label: 'MP3 320',  hd: 'AUDIO / MP3 320 kbps' }
].filter(s => s.url);

const watchBtn = $('.cr-watch'), listenBtn = $('.cr-listen');
const vStage = $('.cr-video'), aStage = $('.cr-audio'), vMount = $('.cr-video-mount');
const audio = $('audio.cr-audio'), aState = $('.cr-audio-state'), aHd = $('.cr-audio-hd'), status = $('.cr-status');

// Pick FLAC if this browser can play it, otherwise MP3 (iPhone/Safari)
const probeEl = document.createElement('audio');
let PREF = STREAMS.findIndex(s => probeEl.canPlayType(s.type));
if (PREF < 0) PREF = STREAMS.length - 1;
let si = PREF;

const STATUS_URL = new URL('/status-json.xsl', STREAMS[0].url).href;
const pathOf = u => new URL(u).pathname;
const cur = () => STREAMS[si];

let mode = null, iframe = null, retry = null, dog = null;
let tries = 0, manual = false, pausedAt = 0, lastT = 0;

const say = h => { status.innerHTML = h || ''; };
const setState = s => ['live', 'search', 'dark'].forEach(k => root.classList.toggle('cr-' + k, s === k));
const fresh = () => cur().url + (cur().url.includes('?') ? '&' : '?') + '_=' + Date.now();

function label() {
  listenBtn.querySelector('.sub').textContent = cur().label;
  aHd.textContent = cur().hd;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'From a Fountain', artist: 'Live vinyl · ' + cur().label });
  }
}

/* ---------- ON AIR check: reads Icecast's tiny status file, never opens the stream ---------- */
async function onAir() {
  for (const headers of [{ 'ngrok-skip-browser-warning': '1' }, {}]) {
    try {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), 5000);
      const r = await fetch(STATUS_URL, { cache: 'no-store', headers, signal: c.signal });
      clearTimeout(t);
      const j = await r.json();
      const src = [].concat(j.icestats?.source || []);
      const live = src.some(s => s.listenurl && pathOf(s.listenurl) === pathOf(cur().url));
      const listeners = src.reduce((n, s) => n + (s.listeners || 0), 0);
      return { live, listeners };
    } catch {}
  }
  return null; // couldn't tell
}

async function refresh() {
  if (mode) return;
  const s = await onAir();
  if (mode) return;
  if (!s) { setState(''); say('Hit <b>WATCH</b> or <b>LISTEN</b>.'); return; }
  setState(s.live ? 'live' : 'dark');
  say(s.live
    ? `Tuned in${s.listeners ? ` · ${s.listeners} listening` : ''}. Hit <b>WATCH</b> or <b>LISTEN</b>.`
    : 'Station is dark right now.');
}

/* ---------- Audio ---------- */
function connect() {
  clearTimeout(retry);
  audio.src = fresh();          // always rejoin at the live edge
  audio.load();
  audio.play()?.catch?.(e => {
    if (e.name === 'NotAllowedError') { aState.textContent = 'PRESS PLAY'; say('Tap play on the audio bar to start.'); }
  });
}

function startAudio() {
  manual = false; tries = 0; si = PREF;
  label();
  aState.textContent = 'CONNECTING';
  connect();
}

function stopAudio() {
  manual = true; tries = 0; pausedAt = 0;
  clearTimeout(retry); clearTimeout(dog);
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  aState.textContent = 'STOPPED';
}

function reconnect() {
  if (manual || mode !== 'listen') return;
  clearTimeout(dog); clearTimeout(retry);
  tries++;
  aState.textContent = 'RETUNING';
  say('Signal dropped — retuning…');
  retry = setTimeout(() => { if (!manual && mode === 'listen') connect(); }, Math.min(1000 * 1.6 ** tries, 15000));
}

// Only reconnect if audio is truly stuck for 10 s (brief hiccups recover on their own)
const arm = () => { clearTimeout(dog); dog = setTimeout(reconnect, 10000); };

audio.addEventListener('playing', () => {
  clearTimeout(dog); tries = 0;
  aState.textContent = cur().label;
  setState('live'); say('');
});
audio.addEventListener('timeupdate', () => {
  if (audio.currentTime !== lastT) { lastT = audio.currentTime; clearTimeout(dog); }
});
audio.addEventListener('waiting', () => { aState.textContent = 'BUFFERING'; arm(); });
audio.addEventListener('stalled', arm);
audio.addEventListener('ended', reconnect);

audio.addEventListener('error', () => {
  if (manual || mode !== 'listen' || !audio.getAttribute('src')) return;
  const code = audio.error?.code;
  // First attempt can't decode/load this format → switch to MP3 backup
  if ((code === 3 || code === 4) && tries === 0 && si < STREAMS.length - 1) {
    si++; label(); connect(); return;
  }
  reconnect();
});

// Resuming after a pause jumps back to live instead of playing stale audio
audio.addEventListener('pause', () => {
  if (!manual && mode === 'listen') { pausedAt = Date.now(); clearTimeout(dog); aState.textContent = 'PAUSED'; }
});
audio.addEventListener('play', () => {
  const stale = pausedAt && Date.now() - pausedAt > 3000;
  pausedAt = 0;
  if (stale && mode === 'listen') connect();
});

// Phone switched networks / came back online
window.addEventListener('online', () => {
  if (mode === 'listen' && !manual) { tries = 0; connect(); }
});

/* ---------- Video ---------- */
function buildVideo() {
  if (iframe) return;
  iframe = document.createElement('iframe');
  iframe.src = 'https://www.youtube.com/embed/live_stream?channel=' + encodeURIComponent(CH) + '&autoplay=1&playsinline=1&rel=0';
  iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
  iframe.setAttribute('allowfullscreen', '');
  iframe.title = 'From a Fountain video';
  vMount.appendChild(iframe);
}
function teardownVideo() {
  if (!iframe) return;
  iframe.src = 'about:blank';
  iframe.remove();
  iframe = null;
  vMount.innerHTML = '';
}

/* ---------- Buttons ---------- */
function reflect() {
  watchBtn.setAttribute('aria-pressed', mode === 'watch');
  listenBtn.setAttribute('aria-pressed', mode === 'listen');
  watchBtn.firstChild.textContent = mode === 'watch' ? 'CLOSE' : 'WATCH';
  listenBtn.firstChild.textContent = mode === 'listen' ? 'STOP' : 'LISTEN';
}
function stopAll() {
  mode = null;
  teardownVideo(); stopAudio();
  vStage.classList.add('hidden'); aStage.classList.add('hidden');
  reflect(); say(''); refresh();
}
function goWatch() {
  if (mode === 'watch') return stopAll();
  stopAudio(); aStage.classList.add('hidden');
  mode = 'watch'; reflect();
  vStage.classList.remove('hidden'); buildVideo();
  setState('live');
  say('Video on. If the player says offline, the set hasn’t started yet.');
}
function goListen() {
  if (mode === 'listen') return stopAll();
  teardownVideo(); vStage.classList.add('hidden');
  mode = 'listen'; reflect();
  aStage.classList.remove('hidden');
  say(''); startAudio();
}

watchBtn.addEventListener('click', goWatch);
listenBtn.addEventListener('click', goListen);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !mode) refresh(); });

label();
say('Tuning…');
refresh();
setInterval(() => { if (!mode) refresh(); }, 30000);
})();
</script>
